services:
  backend:
    build:
      context: ./backend
    image: mahira123/fullstack-flask-backend:1.0
    container_name: flask-backend
    restart: unless-stopped
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    image: mahira123/fullstack-express-frontend:1.0
    container_name: express-frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      BACKEND_URL: "http://backend:5000"
    ports:
      - "3000:3000"
    depends_on:
      - backend