<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full-Stack Form</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Student Contact Form</h1>
    <p>Complete the form. Express will send your details to the Flask backend.</p>
    <form action="/submit" method="POST">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required maxlength="100">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required maxlength="150">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required maxlength="1000"></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
